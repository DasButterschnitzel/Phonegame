name: Android production release

# The only workflow that builds with live AdMob units and the upload key. Manual only, and the job runs in the
# "production" environment: give it required reviewers (Settings → Environments → production) and keep the secrets
# there. Steps: docs/RELEASE_CHECKLIST.md. Secrets and IDs are read through env and never printed.

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Build number 0–99 (only to re-upload the same version; otherwise bump the version in package.json)'
        required: true
        default: '0'
      register_test_devices:
        description: 'Register ADMOB_TEST_DEVICE_IDS in this build (internal testing only, never for the public track)'
        type: boolean
        default: false

permissions:
  contents: write # pushes the play-<versionCode> tag that marks the code as used

concurrency:
  group: android-production
  cancel-in-progress: false

jobs:
  production:
    name: Signed AAB with live ads
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # play-* tags for the versionCode check
      - name: Every secret is present (names only)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD \
                   ADMOB_APP_ID_ANDROID ADMOB_ANDROID_REWARDED ADMOB_ANDROID_INTERSTITIAL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the production environment:$missing (docs/RELEASE_CHECKLIST.md)"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'
      - run: npm ci
      - name: versionCode, higher than every production build before
        id: version
        env:
          BUILD: ${{ inputs.build }}
        run: node scripts/version.ts --build "$BUILD" --check-tags --github-output
      - name: Unit tests
        run: npm test
      - name: Build web assets (native flavor)
        run: npm run build:native && npx cap sync android
      - name: Upload key from its secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Signed bundle, production ads
        working-directory: android
        env:
          ADMOB_MODE: production
          ADMOB_APP_ID_ANDROID: ${{ secrets.ADMOB_APP_ID_ANDROID }}
          ADMOB_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          ADMOB_ANDROID_REWARDED_BOOST: ${{ secrets.ADMOB_ANDROID_REWARDED_BOOST }}
          ADMOB_ANDROID_REWARDED_UPGRADE: ${{ secrets.ADMOB_ANDROID_REWARDED_UPGRADE }}
          ADMOB_ANDROID_REWARDED_BONUS: ${{ secrets.ADMOB_ANDROID_REWARDED_BONUS }}
          ADMOB_TEST_DEVICE_IDS: ${{ inputs.register_test_devices && secrets.ADMOB_TEST_DEVICE_IDS || '' }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease packageReleaseUniversalApk --no-daemon
      - name: Delete the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Audit the bundle (live ads, upload key, no debug code)
        env:
          VC: ${{ steps.version.outputs.version_code }}
          VN: ${{ steps.version.outputs.version_name }}
          TEST_DEVICES: ${{ inputs.register_test_devices }}
        run: |
          O=android/app/build/outputs
          devices="--no-test-devices"
          [ "$TEST_DEVICES" = "true" ] && devices=""
          # shellcheck disable=SC2086
          node scripts/audit-android.ts --apk "$O/apk_from_bundle/release/app-release-universal.apk" --aab "$O/bundle/release/app-release.aab" \
            --mode production --signed --version-code "$VC" --version-name "$VN" $devices
      - uses: actions/upload-artifact@v4
        with:
          name: crop-crawler-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Mark the versionCode as used
        env:
          VC: ${{ steps.version.outputs.version_code }}
        run: |
          git tag "play-$VC"
          git push origin "play-$VC"
