name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build all flavors
        run: npm run build:all
      - name: Bundle budget + ad-provider isolation
        run: npm run bundle:check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run e2e
      - name: Balance report
        if: always()
        continue-on-error: true
        run: |
          echo '## Balance report (greedy bots)' >> "$GITHUB_STEP_SUMMARY"
          npm run --silent balance -- --profile all --md >> "$GITHUB_STEP_SUMMARY"
      - name: Package portal builds
        run: npm run package:portals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: |
            e2e-screens/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: portal-zips
          path: portals/*.zip
